<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q-Learning Maze Race</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Q-Learning Maze Race</h1>
  <p>Maze size: <select id="size"></select></p>
  <p id="info"></p>
  <p id="round"></p>
  <div id="maze"></div>
  <p id="moves">Moves: 0</p>
  <p id="result"></p>
  <p id="counter"></p>
  <p id="replayInfo"></p>
  <button id="watchAI" hidden>See what the AI did</button>
  <button id="nextRound" hidden>Next round</button>
  <button id="newMaze">New maze</button>
  <script src="script.js"></script>
</body>
</html>
